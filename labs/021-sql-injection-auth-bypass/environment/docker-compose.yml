name: dojo-web-021

services:
  readyz:
    image: nginx:1.27-alpine
    container_name: dojo-sqli-readyz
    ports:
      - "9212:80"
    volumes:
      - ./readyz/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - target
      - collector
      - tools
    networks:
      - dojo-sqli
    restart: unless-stopped

  target:
    build:
      context: ./target
    container_name: dojo-sqli-target
    ports:
      - "9210:8080"
    networks:
      dojo-sqli:
        ipv4_address: 10.44.0.10
        aliases:
          - target.dojo.local
    restart: unless-stopped

  collector:
    build:
      context: ./collector
    container_name: dojo-sqli-collector
    ports:
      - "9211:8081"
    volumes:
      - sqli-proof-state:/data
    networks:
      dojo-sqli:
        ipv4_address: 10.44.0.11
        aliases:
          - collector.dojo.local
    restart: unless-stopped

  tools:
    image: dojo-base-attacker:local
    container_name: dojo-sqli-tools
    command: ["tail", "-f", "/dev/null"]
    environment:
      - DOJO_LAB=021-sql-injection-auth-bypass
      - DOJO_LLM=${DOJO_LLM:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      - ../tools:/attacker/tools:ro
      - ../output:/attacker/output:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      dojo-sqli:
        ipv4_address: 10.44.0.5
        aliases:
          - tools.dojo.local
    restart: unless-stopped

networks:
  dojo-sqli:
    driver: bridge
    ipam:
      config:
        - subnet: 10.44.0.0/24

volumes:
  sqli-proof-state:
